{% extends "base.html" %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0 mt-4">
                <div class="card-header bg-white text-center py-3">
                    <h2 class="mb-0">Dashboard</h2>
                </div>
                <div class="card-body p-4 text-center">
                    <h4 class="card-title text-success mb-3">Welcome back!</h4>
                    <p class="card-text fs-5">Hello, <strong>{{ current_user.username }}</strong>! This is your personal dashboard.</p>
                </div>
                <div class="card-footer text-muted text-center py-3 bg-light">
                    Logged in securely.
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
